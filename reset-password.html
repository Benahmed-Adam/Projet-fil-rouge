<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Définir un nouveau mot de passe après récupération">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset-password.css">
    <title>Nouveau mot de passe</title>
</head>

<body>
    <header>
        <h1>Nouveau mot de passe</h1>
        <p>Choisissez un nouveau mot de passe pour votre compte.</p>
    </header>

    <main id="main-reset">
        <section>
            <form class="form" id="form-reset">
                <div>
                    <label for="password-reset">Nouveau mot de passe</label>
                    <input type="password" name="password" id="password-reset" autocomplete="new-password"
                        minlength="6" required>
                </div>
                <div>
                    <label for="password-reset-confirm">Confirmation du nouveau mot de passe</label>
                    <input type="password" name="password-confirm" id="password-reset-confirm"
                        autocomplete="new-password" minlength="6" required>
                </div>
                <button type="submit" id="btn-reset" disabled>Enregistrer le nouveau mot de passe</button>
                <p class="message" id="reset-message"></p>
            </form>
        </section>
    </main>
    <script type="module" src="js/reset-password.js"></script>
</body>

</html>
