<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Liste des conversations et messages échangés">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/conversation.css">
    <title>Conversationner</title>
</head>

<body>
    <header>
        <nav>
            <a href="contact.html">Vers les contacts</a>
            <a href="parametre.html">Vers les paramètres</a>
        </nav>
    </header>

    <main>
        <aside>
            <h2>Liste des conversations</h2>
            <nav>
                <ul id="conversations-list"></ul>
            </nav>
            <form class="form nouvelle-conversation" id="form-nouvelle-conversation">
                <h3>Créer une nouvelle conversation</h3>
                <label for="nouvelle_conversation_nom">Nom de la conversation</label>
                <input type="text" id="nouvelle_conversation_nom" name="salon" placeholder="Ex. : Salon de qualité"
                    maxlength="60" autocomplete="off" required>
                <div class="champ-public">
                    <label for="salon-public">Salon public</label>
                    <input type="checkbox" id="salon-public" name="public" role="switch" checked>
                </div>
                <button type="submit" id="nouvelle_conversation">Créer</button>
                <p class="message" id="nouvelle-conversation-message"></p>
            </form>
        </aside>

        <section>
            <h1>Messages de la conversation : <span id="conversation-name"></span></h1>
            <ul id="messages-list"></ul>

            <form class="form" id="form-nouveau-message">
                <label for="nouveau-message">Le message :</label>
                <input type="text" id="nouveau-message" name="message" placeholder="Écrivez votre message…"
                    maxlength="2000" autocomplete="off">
                <button type="submit" id="btn-envoyer-message">Envoyer le message</button>

                <div class="champ-image">
                    <label for="image-message">Ajouter une image :</label>
                    <input type="file" id="image-message" name="image" accept="image/*">
                    <button type="button" id="btn-retirer-image" hidden>Retirer l'image</button>
                </div>

                <figure id="apercu-image" hidden>
                    <img id="apercu-image-visuel" src="" alt="Aperçu de l'image sélectionnée">
                    <figcaption id="apercu-image-nom"></figcaption>
                </figure>

                <p class="message" id="message-form-message"></p>
            </form>
        </section>
    </main>
    <script type="module" src="js/conversation.js"></script>
</body>

</html>
