<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gérez vos contacts et vos invitations de groupe">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
    <title>Contacts</title>
</head>

<body>
    <header>
        <nav>
            <a href="conversation.html">Vers conversation</a>
        </nav>
    </header>

    <main>
        <h1>Contacts</h1>

        <section>
            <h2>Salons publics</h2>
            <ul id="salons-publics"></ul>
            <p class="liste-vide" id="salons-publics-vide" hidden>Aucun salon public à rejoindre.</p>
            <p class="message" id="salons-publics-message"></p>
        </section>

        <section>
            <h2>Liste des invitations reçues</h2>
            <ul id="invitations-recues"></ul>
            <p class="liste-vide" id="invitations-recues-vide" hidden>Aucune invitation reçue.</p>
            <p class="message" id="invitations-recues-message"></p>
        </section>

        <section>
            <h2>Liste des invitations envoyées</h2>
            <ul id="invitations-envoyees"></ul>
            <p class="liste-vide" id="invitations-envoyees-vide" hidden>Aucune invitation envoyée.</p>
            <p class="message" id="invitations-envoyees-message"></p>
        </section>
    </main>
    <script type="module" src="js/contact.js"></script>
</body>

</html>
