<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - inscription</title>
</head>
<body>
    <div>
        <h2>Connexion</h2>
        <form action="/connection" method="post">
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <label for="password">Mot de passe</label>
            <input type="password" name="password" id="password">
            <label for="stay_connected">Rester connecter</label>
            <input type="checkbox" name="stay_connected" id="stay_connected">
            <button type="submit">Connexion</button>
        </form>
    </div>
    <div>
        <h2>Inscription</h2>
        <form action="/inscription" method="post">
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <label for="password">Mot de passe</label>
            <input type="password" name="password" id="password">
            <button type="submit">Inscription</button>
        </form>
    </div>
    <div>
        <h2>Réupération du mot de passe</h2>
        <form action="/recover_password" method="post">
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <button type="submit">Récupérer le mot de passe</button>
        </form>
    </div>
</body>
</html>
