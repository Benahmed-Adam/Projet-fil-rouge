<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="media/icon.ico" />
    <meta
      name="description"
      content="Page de connexion, d'inscription et de récupération de mot de passe"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <title>Connexion - Inscription</title>
  </head>

  <body>
    <header>
      <h1>Messagerie de qualité</h1>
      <p>Connectez-vous ou créez un compte pour continuer.</p>
    </header>

    <main id="main-index">
      <!-- Connexion -->
      <section>
        <h2>Connexion</h2>
        <form class="form" id="form-connexion">
          <div>
            <label for="email-connexion">Email</label>
            <input
              type="email"
              name="email"
              id="email-connexion"
              autocomplete="email"
              required
            />
          </div>
          <div>
            <label for="password-connexion">Mot de passe</label>
            <input
              type="password"
              name="password"
              id="password-connexion"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" id="btn-connexion">Connexion</button>
          <p class="message" id="connexion-message"></p>
        </form>
      </section>

      <!-- Inscription -->
      <section>
        <h2>Inscription</h2>
        <form class="form" id="form-inscription">
          <div>
            <label for="pseudo-inscription">Pseudo</label>
            <input
              type="text"
              name="username"
              id="pseudo-inscription"
              autocomplete="username"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9_]{3,30}"
              title="3 à 30 caractères : lettres sans accent, chiffres ou _"
              required
            />
          </div>
          <div>
            <label for="email-inscription">Email</label>
            <input
              type="email"
              name="email"
              id="email-inscription"
              autocomplete="email"
              required
            />
          </div>
          <div>
            <label for="password-inscription">Mot de passe</label>
            <input
              type="password"
              name="password"
              id="password-inscription"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>
          <div>
            <label for="password-inscription-confirm"
              >Confirmation du mot de passe</label
            >
            <input
              type="password"
              name="password-confirm"
              id="password-inscription-confirm"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>
          <button type="submit" id="btn-inscription">Inscription</button>
          <p class="message" id="inscription-message"></p>
        </form>
      </section>

      <!-- Récupération du mot de passe : envoie un email avec un lien -->
      <section>
        <h2>Récupération du mot de passe</h2>
        <form class="form" id="form-recuperation">
          <div>
            <label for="email-recuperation">Email</label>
            <input
              type="email"
              name="email"
              id="email-recuperation"
              autocomplete="email"
              required
            />
          </div>
          <button type="submit" id="btn-recuperation">Recevoir le lien</button>
          <p class="message" id="recuperation-message"></p>
        </form>
      </section>
    </main>
    <script type="module" src="js/index.js"></script>
  </body>
</html>
