<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page de connexion, d'inscription et de récupération de mot de passe">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Connexion - Inscription</title>
</head>

<body>
    <header>
        <h1>Messagerie de qualité</h1>
        <p>Connectez-vous ou créez un compte pour continuer.</p>
    </header>

    <main id="main-index">
        <section>
            <h2>Connexion</h2>
            <div class="form" id="form-connexion">
                <div>
                    <label for="email-connexion">Email</label>
                    <input type="email" name="email" id="email-connexion" autocomplete="email" required>
                </div>
                <div>
                    <label for="password-connexion">Mot de passe</label>
                    <input type="password" name="password" id="password-connexion" autocomplete="current-password"
                        required>
                </div>
                <button type="button" id="btn-connexion">Connexion</button>
                <h3 id="connexion-error"></h3>
            </div>
        </section>

        <section>
            <h2>Inscription</h2>
            <div class="form" id="form-inscription">
                <div>
                    <label for="email-inscription">Email</label>
                    <input type="email" name="email" id="email-inscription" autocomplete="email" required>
                </div>
                <div>
                    <label for="password-inscription">Mot de passe</label>
                    <input type="password" name="password" id="password-inscription" autocomplete="new-password"
                        required>
                </div>
                <div>
                    <label for="password-inscription-confirm">Confirmation du mot de passe</label>
                    <input type="password" name="password-confirm" id="password-inscription-confirm"
                        autocomplete="current-password" required>
                </div>
                <button type="button" id="btn-inscription">Inscription</button>
                <h3 id="inscription-error"></h3>
            </div>
        </section>

        <section>
            <h2>Récupération du mot de passe</h2>
            <div class="form" id="form-recuperation">
                <div>
                    <label for="email-recuperation">Email</label>
                    <input type="email" name="email" id="email-recuperation" autocomplete="email" required>
                </div>
                <button type="button" id="btn-recuperation">Récupérer le mot de passe</button>
                <h3 id="recuperation-error"></h3>
            </div>
        </section>
    </main>
    <script type="module" src="js/index.js"></script>
</body>

</html>
